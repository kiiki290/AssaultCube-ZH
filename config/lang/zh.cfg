translate "Search reference for: " "在参考手册中搜索："
translate "Team Deathmatch: Shred the enemy team to pieces!" "团队死斗：把敌方队伍撕成碎片！"
translate "Co-operative Editing: Edit maps with others online!" "协作编辑：与其他人在线共同编辑地图！"
translate "Deathmatch: Destroy anything that moves! Everyone for themselves!" "死斗：摧毁一切会动的东西！各自为战！"
translate "Survivor: Conserve your precious life, destroy the enemy's. Once all your enemies are dead, the round restarts." "生存：珍惜你的小命，干掉敌人的。所有敌人死亡后，本回合重新开始。"
translate "Team Survivor: Conserve your precious life, destroy the enemy team. Once all your enemies are dead, the round restarts." "团队生存：珍惜你的小命，消灭敌方队伍。所有敌人死亡后，本回合重新开始。"
translate "Capture the Flag: Steal the enemy teams flag and bring it to your home base. Don't let your own flag get stolen." "夺旗：偷走敌方队伍的旗帜并带回己方基地。别让自己的旗被偷走。"
translate "Pistol Frenzy: Can you make your enemy eat lead with the most simplest of weapons?" "手枪狂潮：你能用最简陋的武器让敌人吃子弹吗？"
translate "Bot Team Deathmatch: Find the enemy A.I. and destroy them!" "机器人团队死斗：找到敌方 AI 并消灭它们！"
translate "Bot Deathmatch: It's every man and A.I. for themselves! Dismantle those bots!" "机器人死斗：人和 AI 各自为战！拆了那些机器人！"
translate "Last Swiss Standing: Knive and bomb the enemy!" "最后幸存：用刀和炸弹干掉敌人！"
translate "One Shot, One Kill: You and your opponents start with 1hp, a sniper rifle, a knife and no pickups. Survive with your sniper, or humiliate with your swiss steel." "一枪一命：你和对手开局只有 1 点生命、一把狙击枪、一把匕首，且没有补给。用狙击枪活下来，或用你的瑞士钢刀羞辱对手。"
translate "Team One Shot, One Kill: Your team starts with 1hp, a sniper rifle, a knife and no pickups. Survive with your sniper, or humiliate with your swiss steel." "团队一枪一命：你的队伍开局只有 1 点生命、一把狙击枪、一把匕首，且没有补给。用狙击枪活下来，或用你的瑞士钢刀羞辱对手。"
translate "Bot One Shot, One Kill: You and the bots start with 1hp, a sniper rifle, a knife and no pickups. Survive with your sniper, or humiliate with your swiss steel." "机器人一枪一命：你和机器人开局只有 1 点生命、一把狙击枪、一把匕首，且没有补给。用狙击枪活下来，或用你的瑞士钢刀羞辱对手。"
translate "Hunt the Flag: Find the enemy flag, frag the flag bearer and collect the flag to score. Protect your own team flag. If the flag bearer collects the enemy flag, they gain a 1 point bonus." "猎旗：找到敌方旗帜，击毙持旗者并拾取旗帜得分。保护好己方旗帜。若持旗者拾取敌方旗帜，可额外获得 1 分。"
translate "Team Keep the Flag: There is only one flag. Get the flag and keep it. You score one point every 15 seconds. If your teammate has the flag, protect him. If the flag bearer collects the enemy flag, they gain a 1 point bonus." "团队保旗：场上只有一面旗。拿到旗并守住它。每 15 秒得 1 分。队友持旗时请保护他。若持旗者拾取敌方旗帜，可额外获得 1 分。"
translate "Keep the Flag: Get the flag and keep it. You score one point every 15 seconds. Everybody else will want to destroy you!" "保旗：拿到旗并守住它。每 15 秒得 1 分。其他所有人都会想干掉你！"
translate "Team Pistol Frenzy: Can you make your enemy team eat lead with the most simplest of weapons?" "团队手枪狂潮：你能用最简陋的武器让敌方队伍吃子弹吗？"
translate "Team Last Swiss Standing: Knive and bomb the enemy team!" "团队最后幸存：用刀和炸弹干掉敌方队伍！"
translate "Bot Pistol Frenzy: Can you make the enemy A.I. eat lead with the most simplest of weapons?" "机器人手枪狂潮：你能用最简陋的武器让敌方 AI 吃子弹吗？"
translate "Bot Last Swiss Standing: Knive and bomb the enemy A.I.!" "机器人最后幸存：用刀和炸弹干掉敌方 AI！"
translate "Bot Team Survivor: Conserve your precious life, destroy the enemy A.I. team! Once all your enemies are dead, the round restarts." "机器人团队生存：珍惜你的小命，消灭敌方 AI 队伍！所有敌人死亡后，本回合重新开始。"
translate "Bot Team One Shot, One Kill: You and your A.I. team start with 1hp, a sniper rifle, a knife and no pickups. Survive with your sniper, or humiliate with your swiss steel." "机器人团队一枪一命：你和你的 AI 队伍开局只有 1 点生命、一把狙击枪、一把匕首，且没有补给。用狙击枪活下来，或用你的瑞士钢刀羞辱对手。"
