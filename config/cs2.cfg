// ---------------------------------------------------------------------------
// CS2 feel preset for AssaultCube (cs2-feel branch)
// Executed from config/autoexec.cfg on every start. Everything here is an
// ordinary CubeScript variable - edit values or comment lines out freely.
// The values below are the CS2 ones, spelled the way CS2 spells them; the
// compiled defaults are AC's own, so this file is what makes the preset.
// ---------------------------------------------------------------------------

// --- view ------------------------------------------------------------------
// sv_cs2fov makes fov/scopefov/viewmodelfov mean what they mean in CS2: a
// value at a 4:3 aspect that the engine widens with the screen (Source's
// ScaleFOVByWidthRatio). So fov 90 is 106.26 degrees of horizontal and 73.74
// of vertical on 16:9, 90.00 on 4:3 - no per-resolution arithmetic needed.
sv_cs2fov 1
fov 90               // CS2's fov_desired. CS2 has no FOV slider; 90 is the value.
scopefov 40          // CS2 AWP first zoom level (m_nZoomFOV1 = 40 in the weapon data)
spectfov 90          // CS2 spectator/world FOV
viewmodelfov 60      // CS2 viewmodel_fov default (CS2's range is 54..68, AC's is 30..120)
maxroll 0            // disable AC's screen tilt while strafing
maxrolleffect 0      // disable AC's tilt on taking damage
nosway 0             // weapon sway stays on; tune with the sway*div variables below

// --- mouse: raw input, no acceleration, no filtering ------------------------
relativemouse 1
sensitivityscale 1
mouseaccel 0
mfilter 0
invmouse 0

// sv_cs2input makes `sensitivity` the CS2 value. CS2 turns sensitivity * m_yaw
// degrees per mouse count; AC's own model (sv_cs2input 0) turns
// sensitivity / 33. Put your CS2 number here and your cm/360 matches.
sv_cs2input 1
sensitivity 2.5      // the value you use in CS2 (2.5 is Source's own default)
m_yaw 0.022          // Source defaults; paste yours straight from CS2
m_pitch 0.022
zoom_sensitivity_ratio_mouse 1.0   // 1.0 = scoping does not change the sensitivity
scopesens 0          // overrides the scoped sensitivity entirely if > 0

// --- crosshair -------------------------------------------------------------
crosshairsize 9
crosshairfx 0
crosshairteamsign 0
loadcrosshair dot

// --- movement (Source PM_* constants, written in Source units so they can be
//     compared 1:1 with CS2's own console cvars) ----------------------------
// These are CS:GO/CS2's published defaults. If your CS2 install reports other
// numbers (local server console, or game/csgo/cfg/counterstrike.cfg), put the
// exact values here - no recompile needed.
sv_accelerate 5.5    // ground acceleration
sv_friction 5.2      // ground friction
sv_stopspeed 80      // below this ground speed, friction stops you outright (counter-strafe)
sv_airaccelerate 12  // air acceleration; set 0 to remove air control entirely
sv_airmaxspeed 30    // air wishspeed cap (Source's GetAirSpeedCap) - limits air-strafe gains
// Jump take-off speed, in cubes/second and deliberately absolute: CS2's jump does not depend on
// the weapon in hand and neither does this one any more. The number is not CS2's sv_jump_impulse
// because AC's gravity is much weaker than Source's, so it is the value that lands the same apex.
//      34.7726 = CS2's 57 unit apex = 3.648 cubes   <- default
//      32      = classic AC's 3.004 cubes, exactly
sv_jumpvel 34.7726
sv_bhopboost 0       // AC's double-jump 1.25x speed boost; 0 = off (it lets bhop gain speed)
sv_crouchjump 0      // AC's crouch-in-air height bump; 0 = off

// --- CS2 weapon model --------------------------------------------------------
// Master switch, then one per sub-model. All three default on; 0 restores the
// pre-CS2-data AC behaviour for that piece, which is how to tell which one moved.
// (sv_cs2fov and sv_cs2input, the view and mouse switches, are set in their own
//  sections above.)
sv_cs2weapons 1        // 0 = classic AC weapons (spread, recoil, speed all revert)
sv_weaponaccuracy 1    // 0 = classic AC spread model (dynspread + global constants)
sv_weaponspeed 1       // 0 = one shared top speed for every weapon
sv_recoil 1            // 0 = the recoil accumulated by the shot count, not CS2's pattern
// The assault rifle fires at CS2's 600 RPM (100 ms) rather than AC's 500, because the recoil
// keeps decaying between shots and that interval is what sets the size of the pattern: 100 ms
// gives CS2's 11.1 degrees of climb, AC's 120 gave 8.9. That interval is also the server's rate
// limit, so it lives in the weapon table (server.h) and is not a cvar.

// --- weapon recoil -----------------------------------------------------------
// CS:GO's constants, which the CS2 weapon data still speaks (see cs2weapons.h).
// If your CS2 install reports other numbers, put the exact values here - no
// recompile needed. Anything you change here regenerates the pattern on the next shot.
sv_recoilscale 2.0          // weapon_recoil_scale: raw punch -> bullet direction offset
sv_recoilvariance 0.55      // weapon_recoil_variance: how much each shot eases into the last
sv_recoilsuppressshots 4    // weapon_recoil_suppression_shots
sv_recoilsuppressfactor 0.75 // weapon_recoil_suppression_factor (first shots are weaker)
sv_recoilveldecay 4.5       // weapon_recoil_vel_decay: how fast the kick itself bleeds off
sv_recoildecayexp 8         // weapon_recoil_decay2_exp: punch decay, proportional part
sv_recoildecaylin 18        // weapon_recoil_decay2_lin: punch decay, flat part (deg/s)
sv_recoilindexdecay 2.0     // weapon_recoil_decay_coefficient: how fast the pattern resets

// The camera half of the recoil, and most of what makes a spray read as one. The view tracks the
// aim punch by view_recoil_tracking, so the whole screen walks upwards while the crosshair stays
// nailed to the middle of it, and every shot adds a short extra punch of its own
// (weapon_recoil_view_punch_extra) that decays on its own clock with view_punch_decay. The shake
// never touches where the bullet goes - the pattern stays reproducible, only the camera moves.
sv_viewrecoiltracking 0.45   // 0 = perfectly still camera; 1.0 = the view moves by the full
                             // punch, i.e. half as fast as the bullets drift off the crosshair
sv_viewpunchextra 0.055      // per-shot screen shake; 0 turns it off
sv_viewpunchdecay 18         // how fast that shake dies away

// Superseded by the model above; these only act when sv_cs2weapons 0.
sv_recoilaim 0       // 1 = recoil displaces the crosshair (classic AC); 0 = bullets only (CS2)
sv_recoilkick 0      // 1 = firing pushes the shooter backwards (classic AC); 0 = off (CS2)
sv_punchscale 0.6    // bullet climb in degrees per unit of the gun's recoil value
sv_punchmax 45       // backstop on the accumulated climb; the CS2 model bounds itself

// Superseded by sv_weaponaccuracy; these only act when that is 0.
sv_firstshotfrac 0   // burst spread on the first shot of a burst (0 = pinpoint, CS2-like)
sv_moveinacc 400     // extra spread at full run speed   (empirical, pre-CS2-data)
sv_airinacc 600      // extra spread while airborne      (scaled from moveinacc, untested)
sv_crouchacc 0.5     // spread multiplier while crouched (1.0 = no effect)

// Superseded by sv_cs2input; these only act when that is 0.
// CS2 derives the scoped sensitivity from the *linear* FOV ratio times
// zoom_sensitivity_ratio_mouse, so neither of these is consulted any more.
autoscopesens 1      // AC's tangent-ratio model, tan(scopefov/2)/tan(fov/2)
scopesensscale 0.5   // AC's flat multiplier when autoscopesens is off
